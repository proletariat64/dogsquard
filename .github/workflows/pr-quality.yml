name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Shell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "No shell scripts found; skipping shell syntax check."
            exit 0
          fi
          bash -n "${scripts[@]}"

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check
          fi

  local-foundation:
    name: Local Foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local foundation commands
        shell: bash
        run: |
          set -euo pipefail
          make help
          make doc-check
          make doc-guard
          make release-check

  pr-scope-guard:
    name: Temporary Scope Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for forbidden paths
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$changed_files"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > "$changed_files"
          else
            : > "$changed_files"
          fi

          echo "Changed files:"
          if [[ -s "$changed_files" ]]; then
            sed 's/^/- /' "$changed_files"
          else
            echo "- none"
          fi

          violations=()
          while IFS= read -r file; do
            case "$file" in
              deploy/*|docker-compose.yml|Dockerfile|.github/workflows/deploy.yml)
                violations+=("$file")
                ;;
              playwright.config.*|*/playwright.config.*|playwright/*|e2e/*|tests/e2e/*|frontend/e2e/*|frontend/tests/e2e/*)
                violations+=("$file")
                ;;
            esac
          done < "$changed_files"

          if [[ "${#violations[@]}" -gt 0 ]]; then
            echo
            echo "Temporary scope guard failed."
            echo "This PR must not add deployment, Docker runtime files, or Playwright files."
            printf -- '- %s\n' "${violations[@]}"
            echo
            echo "Later phases can remove or relax this guard when those areas enter scope."
            exit 1
          fi

          echo "Temporary scope guard passed."

  pr-summary:
    name: PR Quality Summary
    runs-on: ubuntu-latest
    needs:
      - shell-check
      - repository-hygiene
      - local-foundation
      - pr-scope-guard
    if: always()
    steps:
      - name: Summarize required jobs
        shell: bash
        env:
          SHELL_CHECK: ${{ needs.shell-check.result }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          LOCAL_FOUNDATION: ${{ needs.local-foundation.result }}
          PR_SCOPE_GUARD: ${{ needs.pr-scope-guard.result }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "shell-check:$SHELL_CHECK" \
            "repository-hygiene:$REPOSITORY_HYGIENE" \
            "local-foundation:$LOCAL_FOUNDATION" \
            "pr-scope-guard:$PR_SCOPE_GUARD"; do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "PR Quality Summary failed because one or more required jobs did not succeed."
            exit 1
          fi

          echo "PR Quality Summary passed."
