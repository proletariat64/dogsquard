name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Shell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if [[ "${#scripts[@]}" -eq 0 ]]; then
            echo "No shell scripts found; skipping shell syntax check."
            exit 0
          fi
          bash -n "${scripts[@]}"

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check
          fi

  local-foundation:
    name: Local Foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local foundation commands
        shell: bash
        run: |
          set -euo pipefail
          make help
          make doc-check
          make doc-guard
          make release-check

  fake-implementation-guard:
    name: Fake Implementation Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed production code for fake-complete markers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          fi
          make fake-check

  playwright-smoke:
    name: Playwright Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run minimal Playwright smoke
        shell: bash
        run: |
          set -euo pipefail
          make e2e-smoke

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  production-safety-guard:
    name: Production Safety Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for forbidden paths
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$changed_files"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > "$changed_files"
          else
            : > "$changed_files"
          fi

          echo "Changed files:"
          if [[ -s "$changed_files" ]]; then
            sed 's/^/- /' "$changed_files"
          else
            echo "- none"
          fi

          violations=()
          while IFS= read -r file; do
            case "$file" in
              docker-compose.yml|Dockerfile|.github/workflows/deploy.yml|.github/workflows/deploy-production.yml)
                violations+=("$file")
                ;;
              nginx/*|caddy/*|traefik/*|server-config/*|server-config/**|reverse-proxy/*|reverse-proxy/**)
                violations+=("$file")
                ;;
            esac
          done < "$changed_files"

          if [[ "${#violations[@]}" -gt 0 ]]; then
            echo
            echo "Production safety guard failed."
            echo "This PR must not add production workflow files, Docker runtime files, or raw server/reverse-proxy config."
            printf -- '- %s\n' "${violations[@]}"
            echo
            echo "Use explicit approval and a focused PR before adding production automation or server config."
            exit 1
          fi

          echo "Production safety guard passed."

  pr-summary:
    name: PR Quality Summary
    runs-on: ubuntu-latest
    needs:
      - shell-check
      - repository-hygiene
      - local-foundation
      - fake-implementation-guard
      - playwright-smoke
      - production-safety-guard
    if: always()
    steps:
      - name: Summarize required jobs
        shell: bash
        env:
          SHELL_CHECK: ${{ needs.shell-check.result }}
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          LOCAL_FOUNDATION: ${{ needs.local-foundation.result }}
          FAKE_IMPLEMENTATION_GUARD: ${{ needs.fake-implementation-guard.result }}
          PLAYWRIGHT_SMOKE: ${{ needs.playwright-smoke.result }}
          PRODUCTION_SAFETY_GUARD: ${{ needs.production-safety-guard.result }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "shell-check:$SHELL_CHECK" \
            "repository-hygiene:$REPOSITORY_HYGIENE" \
            "local-foundation:$LOCAL_FOUNDATION" \
            "fake-implementation-guard:$FAKE_IMPLEMENTATION_GUARD" \
            "playwright-smoke:$PLAYWRIGHT_SMOKE" \
            "production-safety-guard:$PRODUCTION_SAFETY_GUARD"; do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "PR Quality Summary failed because one or more required jobs did not succeed."
            exit 1
          fi

          echo "PR Quality Summary passed."
